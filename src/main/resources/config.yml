# Starting balance assigned to a player's first join.
starting-balance: 100.00

shop:
  items:
    DIAMOND: 250.00
    IRON_INGOT: 25.00
    GOLD_INGOT: 50.00
    EMERALD: 100.00

auction:
  max-listings: 5
  duration-hours: 48

daily-reward: "50.00"

jobs:
  rewards:
    miner:
      ore: "2.00"
    farmer:
      crop: "1.00"
    hunter:
      mob: "3.00"
    fisher:
      fish: "2.50"

bounty:
  minimum-cents: 100

sell:
  prices:
    DIAMOND: "12.00"
    IRON_INGOT: "1.00"
    GOLD_INGOT: "2.00"
    EMERALD: "5.00"
    COAL: "0.25"
    REDSTONE: "0.10"
    LAPIS_LAZULI: "0.20"
    COPPER_INGOT: "0.15"
    WHEAT: "0.10"
    CARROT: "0.10"
    POTATO: "0.10"
    OAK_LOG: "0.30"
    SPRUCE_LOG: "0.30"

# Six fixed season teams. Edit names before players join.
teams:
  names: [Red, Blue, Green, Yellow, Purple, Orange]

# Control point capture and team treasury income.
control-points:
  capture-seconds: 30
  radius: 6
  reward-cents: 2500
  reward-interval-seconds: 300


ctf:
  score-to-win: 3


random-events:
  automatic: false
  interval-minutes: 120
  duration-seconds: 120
