# Starting balance assigned to a player's first join.
starting-balance: 100.00

# Server shop prices are in dollars and support two decimal places.
shop:
  items:
    DIAMOND: 250.00
    IRON_INGOT: 25.00
    GOLD_INGOT: 50.00
    EMERALD: 100.00

# Auction house settings.
auction:
  max-listings: 5
  duration-hours: 48

# Daily reward amount. Players can claim once every 24 hours.
daily-reward: "50.00"

# Job rewards are paid per qualifying activity.
jobs:
  rewards:
    miner:
      ore: "2.00"
    farmer:
      crop: "1.00"
    hunter:
      mob: "3.00"
    fisher:
      fish: "2.50"

# Bounty minimum is stored in cents ($1.00 = 100).
bounty:
  minimum-cents: 100

# /sell prices are paid per item. Items not listed here cannot be sold.
sell:
  prices:
    DIAMOND: "12.00"
    IRON_INGOT: "1.00"
    GOLD_INGOT: "2.00"
    EMERALD: "5.00"
    COAL: "0.25"
    REDSTONE: "0.10"
    LAPIS_LAZULI: "0.20"
    COPPER_INGOT: "0.15"
    WHEAT: "0.10"
    CARROT: "0.10"
    POTATO: "0.10"
    OAK_LOG: "0.30"
    SPRUCE_LOG: "0.30"
