name: MoneySMP
version: 0.6.0
main: dev.moneysmp.MoneySMP
api-version: '1.21.11'
author: Onyx Tier List
description: A gradually expanding Money SMP plugin.
commands:
  money:
    description: View your current balance.
    usage: /money
    aliases: [bal, balance]
  pay:
    description: Send money to another online player.
    usage: /pay <player> <amount>
  eco:
    description: Manage a player's balance.
    usage: /eco <give|take|set> <player> <amount>
    permission: moneysmp.admin
  shop:
    description: Open the server item shop.
    usage: /shop
  pshop:
    description: Create and manage player-owned chest shops.
    usage: /pshop <create|price|remove|list>
permissions:
  moneysmp.balance:
    description: Allows a player to view their balance.
    default: true
  moneysmp.pay:
    description: Allows a player to send money to another player.
    default: true
  moneysmp.admin:
    description: Allows access to administrative economy commands.
    default: op
